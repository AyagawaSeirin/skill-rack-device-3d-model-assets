interface:
  display_name: "Rack Device 3D Assets"
  short_description: "严格按真实设备复刻服务器与网络设备三维外观，默认选 AC 电源并交付 Web 版本"
  default_prompt: "使用 $skill-rack-device-3d-model-assets，按同型号同配置真实设备进行写实复刻，要求外观一致，禁止动画、卡通等演示风格；电源未指定时默认选该型号支持的 AC 电源，交付验证后的 Blender、原版 GLB、各角度预览，以及小于 30,000,000 字节并通过浏览器检查的独立 -web.glb，Web 版允许适度降质但保持写实。"
